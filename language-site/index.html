  <header class="header">
    <a class="brand" href="#" aria-label="兆材云库首页"><img data-asset="logo" alt="兆材云库" width="74" height="40"></a>
    <nav class="nav" aria-label="主导航">
      <a href="#" data-copy="home">首页</a><a href="#materials" class="active" data-copy="materials">找物料</a><a href="#" data-copy="inspiration">看案例</a><a href="#" data-copy="discovery">材料推荐</a><a href="#" data-copy="projects">做项目</a>
    </nav>
    <div class="header-actions">
      <img class="member-banner" data-asset="member" alt="开会员送灵感币" width="155" height="60">
      <div class="preference-anchor">
        <button class="preference-trigger" id="preferenceTrigger" aria-haspopup="dialog" aria-controls="preferences" aria-expanded="false">
          <svg class="icon globe"><use href="#i-globe"/></svg>
          <span class="trigger-copy" id="currentPreference">中国站 · 简体中文</span>
          <svg class="icon chevron"><use href="#i-chevron"/></svg>
        </button>
      </div>
      <button class="icon-button utility-button" data-local-action="messages" aria-label="消息"><svg class="icon"><use href="#i-chat"/></svg></button>
      <button class="icon-button utility-button" data-local-action="announcements" aria-label="公告"><svg class="icon"><use href="#i-speaker"/></svg></button>
      <button class="avatar-button" data-local-action="account" aria-label="用户中心"><img data-asset="avatar" alt="" width="32" height="32"></button>
    </div>
  </header>

  <div class="site-preview-notice" id="sitePreviewNotice" hidden></div>

  <main class="workspace" id="materials">
    <aside class="sidebar" id="sidebar" aria-label="物料筛选">
      <div class="sidebar-mobile-heading"><strong data-copy="filters">筛选</strong><button class="icon-button" id="closeFilters" aria-label="关闭筛选"><svg class="icon"><use href="#i-close"/></svg></button></div>
      <button class="render-promo" data-local-action="render"><img data-asset="render" alt="" width="600" height="275"><span data-copy="renderList">效果图快速生成物料清单</span></button>
      <section class="category-section">
        <button class="filter-heading" id="categoryToggle" aria-expanded="true" aria-controls="categoryContent"><span data-copy="category">分类</span><svg class="icon"><use href="#i-chevron"/></svg></button>
        <div id="categoryContent">
          <div class="category-search"><input id="categorySearch" aria-label="搜索分类" placeholder="关键字搜索"><svg class="icon"><use href="#i-search"/></svg></div>
          <div class="category-options" id="categoryOptions"></div>
        </div>
      </section>
      <div class="extra-filters" id="extraFilters"></div>
      <button class="reset-filters" id="resetFilters" hidden><svg class="icon"><use href="#i-refresh"/></svg><span data-copy="resetFilters">重置筛选</span></button>
    </aside>

    <section class="results" aria-label="物料列表">
      <form class="search-row" id="searchForm">
        <div class="search-box"><input type="search" id="materialSearch" placeholder="请输入内容" aria-label="搜索物料"><button class="search-button" type="submit" aria-label="搜索"><svg class="icon"><use href="#i-search"/></svg></button></div>
        <button type="button" class="find-similar" data-local-action="similar"><img data-asset="similar" alt="找同款" width="149" height="56"><span class="find-similar-translated" data-copy="findSimilar">找同款</span></button>
      </form>
      <div class="results-toolbar">
        <div class="result-count" id="resultCount" aria-live="polite"></div>
        <div class="sort-actions">
          <button class="filter-mobile button light" id="openFilters"><svg class="icon"><use href="#i-filter"/></svg><span data-copy="filters">筛选</span></button>
          <button class="sort-button" id="sortButton"><span class="sort-symbol">⇅</span><span data-copy="sortDefault">价格: 从低到高</span></button>
          <button class="icon-button reset-sort" id="resetSort" aria-label="重置排序"><svg class="icon"><use href="#i-refresh"/></svg></button>
          <button class="batch-button" id="batchFavorite" disabled data-copy="batchFavorite">批量收藏</button>
          <button class="brand-search" data-local-action="brand"><span data-copy="findBrand">我想找 品牌</span><svg class="icon"><use href="#i-arrow"/></svg></button>
        </div>
      </div>
      <div class="active-filters" id="activeFilters" hidden></div>
      <div class="product-grid" id="productGrid"></div>
      <div class="empty-state" id="emptyState" hidden><svg class="icon"><use href="#i-search"/></svg><strong data-copy="noResults">没有找到相关物料</strong><p data-copy="tryAgain">请试试其他关键词，或清除筛选条件。</p><button class="button yellow" id="clearSearch" data-copy="clearAll">清除搜索和筛选</button></div>
      <p class="catalogue-note" data-copy="sampleNote">当前展示 20 款物料样例</p>
    </section>
  </main>

  <footer class="footer"><span>© 2026 IDEAFUSION</span><button id="footerPreferences"><svg class="icon"><use href="#i-globe"/></svg><span>Language / Site · 语言与站点</span></button><span id="footerStatus">China · 简体中文 · CNY</span></footer>

  <div class="mobile-scrim" id="mobileScrim" hidden></div>
  <section class="preferences" id="preferences" role="dialog" aria-modal="true" aria-label="站点与语言设置" hidden>
    <form id="preferenceForm">
      <div class="setting-group"><label class="setting-label" for="siteSelect">Site <span>/ 站点</span></label><div class="select-wrap"><svg class="icon"><use href="#i-globe"/></svg><select id="siteSelect"><option value="china">China · 中国站</option><option value="global">Global · 国际站</option><option value="japan">Japan · 日本サイト</option></select><svg class="icon"><use href="#i-chevron"/></svg></div></div>
      <div class="setting-group language-group"><label class="setting-label" id="languageLabel">Language <span>/ 语言</span></label><div class="language-options" id="languageOptions" role="group" aria-labelledby="languageLabel"></div></div>
      <div class="setting-group currency-group" id="currencyGroup"><label class="setting-label" for="currencySelect">Currency <span>/ 币种</span></label><div class="select-wrap"><span class="currency-sign" id="currencySign">¥</span><select id="currencySelect"><option value="CNY">CNY · 人民币</option><option value="USD">USD · US Dollar</option><option value="EUR">EUR · Euro</option><option value="JPY">JPY · 日本円</option></select><svg class="icon"><use href="#i-chevron"/></svg></div></div>
      <div class="panel-foot"><button type="button" class="button light" id="cancelPreferences" aria-label="取消" title="取消"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button><button type="submit" class="button yellow" id="applyPreferences" aria-label="应用设置" title="应用设置"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg></button></div>
    </form>
  </section>

  <dialog class="product-dialog" id="productDialog" aria-labelledby="detailName"><button class="icon-button detail-close" id="closeProduct" aria-label="关闭详情"><svg class="icon"><use href="#i-close"/></svg></button><div class="detail-layout"><img id="detailImage" alt=""><div class="detail-copy"><span class="detail-eyebrow" id="detailCategory"></span><h2 id="detailName"></h2><p id="detailBrand"></p><strong id="detailPrice"></strong><button class="button yellow" id="detailFavorite"><svg class="icon"><use href="#i-heart"/></svg><span data-copy="favorite">收藏物料</span></button><p class="detail-note" data-copy="detailNote">商品详情为演示预览</p></div></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden><svg class="icon"><use href="#i-check"/></svg><span id="toastText"></span></div>

  function filteredProducts() {
    const colorMap={beige:[1,7,8,10,11,14,16,17],gray:[2,3,4,6,12],green:[9],white:[2,5]};
    let products=window.DEMO_PRODUCTS.filter(product=>(!state.category||product.category===state.category)&&(!state.query||[...Object.values(product.name),product.brand].join(' ').toLowerCase().includes(state.query.toLowerCase()))&&(!state.extra.brand||product.brand.includes(state.extra.brand))&&(!state.extra.color||colorMap[state.extra.color].includes(product.id))&&(!state.extra.price||(state.extra.price==='under100'&&product.price[0]<100)||(state.extra.price==='from100'&&product.price[0]>=100&&product.price[0]<500)||(state.extra.price==='from500'&&product.price[0]>=500&&product.price[0]<1000)||(state.extra.price==='over1000'&&product.price[0]>=1000)));
    if(state.sort!=='default')products.sort((a,b)=>state.sort==='low'?a.price[0]-b.price[0]:b.price[0]-a.price[0]);
    return products;
  }
  function renderProducts() {
    const products=filteredProducts();
    $('#resultCount').innerHTML=t('count')(products.length);
    $('#productGrid').innerHTML=products.map(product=>`<article class="product-card" data-id="${product.id}"><div class="product-image"><input class="card-select" type="checkbox" aria-label="${t('selectMaterial')} ${escapeHTML(nameOf(product))}" data-select="${product.id}" ${state.selected.has(product.id)?'checked':''}><button class="product-open" data-product="${product.id}" aria-label="${t('open')} ${escapeHTML(nameOf(product))}"><img src="${window.DEMO_ASSETS['product'+product.id]}" alt="${escapeHTML(nameOf(product))}" width="480" height="480" ${product.id>10?'loading="lazy"':''}></button><button class="card-favorite ${state.favorites.has(product.id)?'saved':''}" data-favorite="${product.id}" aria-pressed="${state.favorites.has(product.id)}" aria-label="${t(state.favorites.has(product.id)?'saved':'favorite')} ${escapeHTML(nameOf(product))}">${icon('heart')}</button>${product.green?`<span class="green-badge" aria-label="Green material">${icon('leaf')}</span>`:''}</div><div class="product-meta"><button class="product-name" data-product="${product.id}" title="${escapeHTML(nameOf(product))}">${escapeHTML(nameOf(product))}</button><div class="product-brand" title="${escapeHTML(product.brand)}">${escapeHTML(product.brand)}</div><div class="product-price">${priceOf(product)}</div></div></article>`).join('');
    $('#emptyState').hidden=products.length>0;
    $('#productGrid').hidden=products.length===0;
    $('#batchFavorite').disabled=state.selected.size===0;
    $('#batchFavorite').textContent=t('batchFavorite')+(state.selected.size?` (${state.selected.size})`:'');
    const active=[];
    if(state.query)active.push({key:'query',text:state.query});
    if(state.category)active.push({key:'category',text:categoryName(state.category)});
    Object.entries(state.extra).forEach(([key,value])=>active.push({key,text:key==='brand'?value:t(value)}));
    $('#activeFilters').hidden=!active.length;
    $('#activeFilters').innerHTML=active.map(filter=>`<button data-remove-filter="${filter.key}">${escapeHTML(filter.text)}${icon('close')}</button>`).join('');
    $('#resetFilters').hidden=!active.length;
    $('.catalogue-note').textContent=t('sampleNote')+(state.prefs.currency!=='CNY'?` · ${t('currencyNote')}`:'');
  }
  function renderPage() {
    const prefs=state.prefs;
    document.documentElement.lang={zh:'zh-CN',tw:'zh-TW',en:'en',ja:'ja'}[prefs.language];
    document.title=`${siteName()} · ${t('materials')} | IDEAFUSION Demo`;
    $$('[data-copy]').forEach(element=>element.textContent=t(element.dataset.copy));
    $('#currentPreference').textContent=`${siteName()} · ${languages[prefs.language]}`;
    $('#footerStatus').textContent=`${siteInfo[prefs.site].en} · ${languages[prefs.language]} · ${prefs.currency}`;
    $('#materialSearch').placeholder=t('search');
    $('#materialSearch').setAttribute('aria-label',t('search'));
    $('#categorySearch').placeholder=t('categorySearch');
    $('#categorySearch').setAttribute('aria-label',t('categorySearch'));
    $('#sidebar').setAttribute('aria-label',t('filters'));
    $('.find-similar img').style.display=prefs.language==='zh'?'':'none';
    $('.find-similar-translated').style.display=prefs.language==='zh'?'none':'inline-flex';
    $('#sortButton span:last-child').textContent=sortLabel();
    const a11y=extras[prefs.language];
    Object.entries({'.search-button':'searchAction','[data-local-action="messages"]':'messages','[data-local-action="announcements"]':'announcements','[data-local-action="account"]':'account','#closeFilters':'closeFilters','#closeProduct':'closeDetail','.nav':'nav','.results':'results','.brand':'brandHome'}).forEach(([selector,key])=>$(selector).setAttribute('aria-label',a11y[key]));
    $('#resetSort').setAttribute('aria-label',t('resetFilters'));
    renderCategories();renderExtraFilters();renderProducts();renderSiteNotice();
  }
  function renderSiteNotice() {
    const notice=$('#sitePreviewNotice');
    notice.hidden=state.prefs.site==='china';
    if(!notice.hidden)notice.innerHTML=`<strong>${siteInfo[state.prefs.site].en}</strong> · ${t(state.prefs.site==='global'?'globalPreview':'japanPreview')} <span class="site-notice-divider">&nbsp;&nbsp;|&nbsp;&nbsp;</span><button id="returnChina" style="text-decoration:underline;padding:0 3px">${t('returnChina')}</button>`;
  }
  function renderDraft() {
    const draft=state.draft;
    const hasCurrency=draft.site==='china';
    $('#preferences').classList.toggle('has-currency',hasCurrency);
    $('#currencyGroup').hidden=!hasCurrency;
    $('#currencySelect').disabled=!hasCurrency;
    $('#languageOptions').style.gridTemplateColumns=`repeat(${siteInfo[draft.site].languages.length},1fr)`;
    $('#languageOptions').innerHTML=siteInfo[draft.site].languages.map(language=>`<button type="button" class="language-choice" data-language="${language}" aria-pressed="${draft.language===language}">${escapeHTML(languages[language])}${draft.language===language?icon('check'):''}</button>`).join('');
    $('#siteSelect').value=draft.site;
    $('#currencySelect').value=draft.currency;
    $('#currencySign').textContent=currency[draft.currency].symbol;
    const cancelLabel=t('cancel').split(' / ')[0];
    $('#cancelPreferences').setAttribute('aria-label',cancelLabel);
    $('#cancelPreferences').title=cancelLabel;
    const changedSite=draft.site!==state.prefs.site;
    const applyLabel=(changedSite?t(draft.site==='global'?'goGlobal':draft.site==='japan'?'goJapan':'goChina'):t('apply')).split(' / ')[0];
    $('#applyPreferences').setAttribute('aria-label',applyLabel);
    $('#applyPreferences').title=applyLabel;
    $('#preferences').setAttribute('aria-label',({zh:'站点与语言设置',tw:'站點與語言設定',en:'Site and language settings',ja:'サイトと言語の設定'})[state.prefs.language]);
  }
  function positionPanel() {
    if(matchMedia('(max-width:700px)').matches)return;
    const box=$('#preferenceTrigger').getBoundingClientRect();
    $('#preferences').style.right=`${Math.max(18,innerWidth-box.right)}px`;
    $('#preferences').style.top=`${box.bottom+12}px`;
  }
  function openPreferences(origin=$('#preferenceTrigger')) {
    if(!$('#preferences').hidden){closePreferences();return;}
    state.draft={...state.prefs};lastFocus=origin;
    renderDraft();positionPanel();$('#preferences').hidden=false;$('#preferenceTrigger').setAttribute('aria-expanded','true');
    $('#mobileScrim').hidden=!matchMedia('(max-width:700px)').matches;
    if(!$('#mobileScrim').hidden)document.body.style.overflow='hidden';
    requestAnimationFrame(()=>$('#siteSelect').focus({preventScroll:true}));
  }
  function closePreferences(restoreFocus=true) {
    $('#preferences').hidden=true;$('#preferenceTrigger').setAttribute('aria-expanded','false');state.draft=null;
    if(!$('#sidebar').classList.contains('mobile-open')){$('#mobileScrim').hidden=true;document.body.style.overflow='';}
    if(restoreFocus&&lastFocus)lastFocus.focus({preventScroll:true});
  }
  function applyPrefs(prefs,reason='applied') {
    const previous=state.prefs;
    state.prefs=normalizePrefs(prefs);persist();closePreferences(false);renderPage();
    const message=previous.site!==prefs.site?(prefs.site==='global'?'globalApplied':prefs.site==='japan'?'japanApplied':'applied'):reason;
    toast(t(message));$('#preferenceTrigger').focus({preventScroll:true});
  }
  function clearFilters() {state.query='';state.category='';state.extra={};state.categoryQuery='';$('#materialSearch').value='';$('#categorySearch').value='';renderCategories();renderExtraFilters();renderProducts();}
  function openFilterDrawer() {$('#sidebar').classList.add('mobile-open');$('#mobileScrim').hidden=false;document.body.style.overflow='hidden';$('#closeFilters').focus({preventScroll:true});}
  function closeFilterDrawer() {$('#sidebar').classList.remove('mobile-open');if($('#preferences').hidden){$('#mobileScrim').hidden=true;document.body.style.overflow='';}}
  function toggleFavorite(id) {state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);renderProducts();toast(t(state.favorites.has(id)?'favoriteAdded':'favoriteRemoved'));if(state.detailId===id)$('#detailFavorite span').textContent=t(state.favorites.has(id)?'saved':'favorite');}
  function openProduct(id) {
    const product=window.DEMO_PRODUCTS.find(product=>product.id===id);state.detailId=id;
    $('#detailImage').src=window.DEMO_ASSETS['product'+id];$('#detailImage').alt=nameOf(product);$('#detailName').textContent=nameOf(product);$('#detailBrand').textContent=product.brand;$('#detailCategory').textContent=categoryName(product.category);$('#detailPrice').textContent=priceOf(product);$('#detailFavorite span').textContent=t(state.favorites.has(id)?'saved':'favorite');$('#productDialog').showModal();
  }

  $('#preferenceTrigger').addEventListener('click',()=>openPreferences());
  $('#footerPreferences').addEventListener('click',event=>{window.scrollTo({top:0,behavior:'instant'});openPreferences(event.currentTarget);});
  $('#cancelPreferences').addEventListener('click',()=>closePreferences());
  $('#languageOptions').addEventListener('click',event=>{const button=event.target.closest('[data-language]');if(button){state.draft.language=button.dataset.language;renderDraft();$('#languageOptions').querySelector(`[data-language="${state.draft.language}"]`).focus();}});
  $('#siteSelect').addEventListener('change',event=>{state.draft.site=event.target.value;const info=siteInfo[state.draft.site];if(!info.languages.includes(state.draft.language))state.draft.language=info.defaultLanguage;state.draft.currency=info.defaultCurrency;renderDraft();});
  $('#currencySelect').addEventListener('change',event=>{state.draft.currency=event.target.value;renderDraft();});
  $('#preferenceForm').addEventListener('submit',event=>{event.preventDefault();applyPrefs(state.draft);});
  $('#sitePreviewNotice').addEventListener('click',event=>{if(event.target.closest('#returnChina'))applyPrefs({...DEFAULT});});
  document.addEventListener('pointerdown',event=>{if(!$('#preferences').hidden&&!event.target.closest('#preferences,#preferenceTrigger,#footerPreferences'))closePreferences(false);});
  document.addEventListener('keydown',event=>{
    if(!$('#preferences').hidden){
      if(event.key==='Escape'){event.preventDefault();closePreferences();return;}
      if(event.key==='Tab'){const focusables=$$('#preferences button:not(:disabled),#preferences select:not(:disabled)').filter(element=>element.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    }else if($('#sidebar').classList.contains('mobile-open')){
      if(event.key==='Escape'){closeFilterDrawer();$('#openFilters').focus();}
      if(event.key==='Tab'){const focusables=$$('#sidebar button:not([hidden]),#sidebar input,#sidebar summary').filter(element=>element.getClientRects().length);const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
    }
  });
  window.addEventListener('resize',()=>{if(!$('#preferences').hidden){positionPanel();const mobile=matchMedia('(max-width:700px)').matches;$('#mobileScrim').hidden=!mobile;document.body.style.overflow=mobile?'hidden':'';}if(innerWidth>700&&$('#sidebar').classList.contains('mobile-open'))closeFilterDrawer();});
  $('#mobileScrim').addEventListener('click',()=>{closePreferences();closeFilterDrawer();});
  $('#openFilters').addEventListener('click',openFilterDrawer);
  $('#closeFilters').addEventListener('click',()=>{closeFilterDrawer();$('#openFilters').focus();});
  $('#categorySearch').addEventListener('input',event=>{state.categoryQuery=event.target.value;renderCategories();});
  $('#categoryOptions').addEventListener('click',event=>{if(event.target.matches('input')){state.category=state.category===event.target.value?'':event.target.value;renderCategories();renderProducts();}});
  $('#categoryToggle').addEventListener('click',()=>{const expanded=$('#categoryToggle').getAttribute('aria-expanded')==='true';$('#categoryToggle').setAttribute('aria-expanded',String(!expanded));$('#categoryContent').hidden=expanded;});
  $('#extraFilters').addEventListener('click',event=>{const button=event.target.closest('[data-filter-key]');if(button){const key=button.dataset.filterKey,value=button.dataset.filterValue;state.extra[key]===value?delete state.extra[key]:state.extra[key]=value;renderExtraFilters();renderProducts();}});
  $('#searchForm').addEventListener('submit',event=>{event.preventDefault();state.query=$('#materialSearch').value.trim();renderProducts();});
  $('#materialSearch').addEventListener('search',()=>{state.query=$('#materialSearch').value.trim();renderProducts();});
  $('#resetFilters').addEventListener('click',clearFilters);$('#clearSearch').addEventListener('click',clearFilters);
  $('#activeFilters').addEventListener('click',event=>{const button=event.target.closest('[data-remove-filter]');if(!button)return;const key=button.dataset.removeFilter;if(key==='query'){state.query='';$('#materialSearch').value='';}else if(key==='category')state.category='';else delete state.extra[key];renderCategories();renderExtraFilters();renderProducts();});
  $('#sortButton').addEventListener('click',()=>{state.sort=state.sort==='low'?'high':'low';$('#sortButton span:last-child').textContent=sortLabel();renderProducts();});
  $('#resetSort').addEventListener('click',()=>{state.sort='default';$('#sortButton span:last-child').textContent=sortLabel();renderProducts();});
  $('#productGrid').addEventListener('click',event=>{const favorite=event.target.closest('[data-favorite]'),product=event.target.closest('[data-product]');if(favorite)toggleFavorite(Number(favorite.dataset.favorite));else if(product)openProduct(Number(product.dataset.product));});
  $('#productGrid').addEventListener('change',event=>{if(event.target.matches('[data-select]')){const id=Number(event.target.dataset.select);event.target.checked?state.selected.add(id):state.selected.delete(id);$('#batchFavorite').disabled=!state.selected.size;$('#batchFavorite').textContent=t('batchFavorite')+(state.selected.size?` (${state.selected.size})`:'');}});
  $('#batchFavorite').addEventListener('click',()=>{state.selected.forEach(id=>state.favorites.add(id));state.selected.clear();renderProducts();toast(t('favoritesAdded'));});
  $('#closeProduct').addEventListener('click',()=>$('#productDialog').close());
  $('#productDialog').addEventListener('click',event=>{if(event.target===$('#productDialog')){const box=$('#productDialog').getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)$('#productDialog').close();}});
  $('#detailFavorite').addEventListener('click',()=>toggleFavorite(state.detailId));
  $$('[data-local-action],.nav a,.brand').forEach(element=>element.addEventListener('click',event=>{if(element.getAttribute('href')==='#materials')return;event.preventDefault();toast(t('moreDemo'));}));
  loadAssets();renderPage();
})();

</script>
</body>
</html>
