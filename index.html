    <section class="search-section" id="materials">
      <div class="search-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          <input id="searchInput" type="search" placeholder="搜索物料、品牌、型号、颜色或描述，如：浅灰大理石、意大利进口岩板" />
          <button class="image-search" title="上传图片搜索"><span>▣</span> 以图搜图</button>
        </div>
        <button class="search-btn" id="searchBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
          搜索
        </button>
      </div>
      <div class="search-dropdown" id="searchDropdown" aria-hidden="true">
        <div class="dropdown-head">
          <div>
            <h2>用图片找物料</h2>
            <p>上传图片，快速查找同款或相似材料</p>
          </div>
          <button class="dropdown-close" id="dropdownClose" aria-label="关闭">×</button>
        </div>
        <div class="image-search-layout">
          <label class="drop-zone" id="dropZone" for="imageFile">
            <input id="imageFile" type="file" accept="image/*" hidden />

            <span>也可以直接按 Ctrl + V 粘贴剪贴板图片</span>
          </label>
        </div>
        <div class="url-search-row">
          <span>或</span>
          <div><input id="imageUrl" type="url" placeholder="粘贴图片地址，如 https://example.com/material.jpg" /><button id="urlSearchBtn">搜索</button></div>
        </div>
        <div class="history-section">
          <div class="history-head"><h3>搜索历史</h3><button id="clearHistory">清空</button></div>
          <div class="history-list" id="historyList"></div>
        </div>
      </div>
      <div class="hot-search">

        <button>微水泥</button><button>长虹玻璃</button><button>木饰面</button><button>岩板</button><button>艺术漆</button><button>大理石</button>

  var BUTTON_ID = "codex-demo-upload-button";

  function dataUrlToFile(dataUrl) {
    var parts = dataUrl.split(",");
    var mime = "image/jpeg";
    var binary = atob(parts[1]);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return new File([bytes], "demo-room-search.jpg", { type: mime });
  }

  function findUploadInput(scope) {
    var inputs = Array.prototype.slice.call(
      (scope || document).querySelectorAll('input[type="file"]')
    );
    if (!inputs.length && scope !== document) {
      inputs = Array.prototype.slice.call(document.querySelectorAll('input[type="file"]'));
    }
    return inputs.find(function (input) {
      return !input.disabled && (!input.accept || input.accept.indexOf("image") !== -1);
    }) || inputs[0];
  }

  function triggerDemoUpload(button, scope) {
    var input = findUploadInput(scope);
    if (!input) {
      window.alert("未找到图片上传控件，请先保持“用图片找物料”窗口打开。");
      return;
    }

    button.disabled = true;
    button.textContent = "正在模拟上传…";

    try {
      var imageDataUrl = DEMO_IMAGE_DATA_URL.replace(
        /^data:[^;]+;/,
        "data:image/jpeg;"
      );
      sessionStorage.setItem("materialSearchImage", imageDataUrl);
      sessionStorage.setItem("materialSearchName", "demo-room-search.jpg");
      window.location.href = "image-search.html?source=upload";
    } catch (error) {
      console.error("模拟上传图片失败：", error);
      window.alert("模拟上传失败，请刷新页面后重试。");
    } finally {
      window.setTimeout(function () {
        button.disabled = false;
        button.textContent = "模拟上传图片";
      }, 1200);
    }
  }

  function findTitle() {
    var candidates = document.querySelectorAll("h1,h2,h3,h4,strong,b,div,span,p");
    for (var i = 0; i < candidates.length; i += 1) {
      if ((candidates[i].textContent || "").trim() === "用图片找物料") {
        return candidates[i];
      }
    }
    return null;
  }

  function installButton() {
    if (document.getElementById(BUTTON_ID)) return;

    var title = findTitle();
    if (!title) return;

    var panel = title.closest('#searchDropdown,.search-dropdown,[role="dialog"],.modal,.dialog,[class*="modal"],[class*="dialog"]');
    var header = panel || title.closest(".dropdown-head") || title.parentElement;
    if (!header) return;

    if (window.getComputedStyle(header).position === "static") {
      header.style.position = "relative";
    }

    var button = document.createElement("button");
    button.id = BUTTON_ID;
    button.type = "button";
    button.textContent = "模拟上传图片";
    button.addEventListener("click", function () {
      triggerDemoUpload(button, panel || document);
    });
    header.appendChild(button);
  }

  installButton();
  new MutationObserver(installButton).observe(document.documentElement, {
    childList: true,
    subtree: true
  });
})();
</script>
</body>
</html>
